plugins { id 'com.android.application' }

android {
    namespace 'de.meinmathetrainer.tv'
    compileSdk 35
    signingConfigs {
        release {
            storeFile file(System.getenv("ANDROID_KEYSTORE_FILE") ?: "release-keystore.jks")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }
    defaultConfig {
        applicationId 'de.meinmathetrainer.tv'
        minSdk 23
        targetSdk 28
        versionCode 36
        versionName '2.6.3'
    }
    lint {
        // This app is distributed as a sideloaded Android TV APK, not through Google Play.
        checkReleaseBuilds false
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
