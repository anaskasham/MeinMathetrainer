<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#123e60">
<title>Mein Mathetrainer | مدرب الرياضيات</title>
<style>
:root{--bg:#eef5fb;--card:#fff;--ink:#183247;--muted:#60778b;--teal:#087e91;--line:#d8e5ee;--green:#16834b;--gold:#ffbf3f;--focus:#ffb300}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;background:radial-gradient(circle at 15% 0%,#e2f3fa 0,#eef5fb 48%,#e9f1f8 100%);color:var(--ink);font-family:Tahoma,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
main{width:min(1100px,100%);margin:auto;padding:clamp(12px,2.2vw,26px)}.hero{background:linear-gradient(120deg,#123e60,#087e91);color:#fff;border-radius:22px;padding:clamp(16px,2.4vw,28px);display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:0 12px 28px #123e6020}.hero h1{font-size:clamp(24px,3.4vw,42px);margin:5px 0}.hero p{margin:5px 0;opacity:.95}.owl{font-size:clamp(48px,7vw,76px);line-height:1}
h2{margin:18px 0 8px}.muted{color:var(--muted)}.stats{display:flex;justify-content:space-between;gap:12px;margin:18px 0 8px;flex-wrap:wrap}.bar{height:12px;background:#dce6ed;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#18a477,#69c99c);width:0;transition:width .25s}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(12px,1.7vw,18px);box-shadow:0 5px 16px #123e600a}.level{width:100%;text-align:right;color:inherit;cursor:pointer;min-height:135px;display:block}.level .top{display:flex;justify-content:space-between;align-items:center;font-size:clamp(23px,3vw,32px);gap:8px}.level b{display:block;margin:9px 0 5px;font-size:clamp(16px,1.8vw,20px)}.pill{font-size:clamp(11px,1.2vw,13px);background:#edf3f6;border-radius:20px;padding:6px 10px;white-space:nowrap}.level.locked{opacity:.52}
button{font:inherit;cursor:pointer;border:2px solid var(--line);border-radius:13px;padding:12px 16px;background:#fff;color:var(--ink);font-weight:bold;min-height:50px;transition:transform .12s,border-color .12s,background .12s}button:focus,.level:focus,.answer:focus{outline:4px solid var(--focus);outline-offset:3px;border-color:#d68a00;box-shadow:0 0 0 6px #ffbf3f30;transform:scale(1.025);z-index:2}.primary{background:var(--teal);border-color:var(--teal);color:#fff}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}
#game{width:min(100%,980px);margin:16px auto}.question{text-align:center;padding:clamp(16px,3vw,32px)}.question h2{font-size:clamp(21px,3vw,36px)}.mainq{font-size:clamp(40px,7vw,76px);font-weight:900;direction:ltr;margin:clamp(14px,2.5vw,28px) 0;line-height:1.2}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.answer{font-size:clamp(24px,3.4vw,38px);min-height:clamp(65px,10vh,90px);direction:ltr}.answer.selected{border:3px solid var(--teal);background:#e7f5f7}.feedback{padding:14px;border-radius:14px;margin:12px 0;min-height:50px}.good{background:#e3f5e9;border:1px solid #80c69a}.bad{background:#fff0e8;border:1px solid #e6a58a}.center{text-align:center}.big{font-size:clamp(44px,7vw,65px)}
@media(min-width:720px){.levels{grid-template-columns:repeat(3,minmax(0,1fr))}.answers{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:520px){main{padding:10px}.hero{border-radius:16px}.levels{grid-template-columns:1fr}.level{min-height:112px}.row button{flex:1}}
/* Android TV / 16:9 landscape layout */
@media(min-width:900px) and (orientation:landscape){main{width:96vw;max-width:1500px;padding:2vh 2vw}.hero{padding:2.2vh 2.2vw;border-radius:24px}.hero h1{font-size:clamp(34px,3vw,52px)}.levels{grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5vh 1.2vw}.level{min-height:17vh;padding:1.8vh 1.5vw}.level b{font-size:clamp(20px,1.6vw,27px)}.level p{margin:7px 0;font-size:clamp(14px,1.05vw,18px)}#game{width:min(92vw,1250px);margin:1.5vh auto}.question{padding:2vh 2vw}.mainq{font-size:clamp(60px,7vh,100px);margin:1.6vh 0}.answers{gap:1.4vw;margin:1.5vh 0}.answer{min-height:11vh;font-size:clamp(30px,3vh,44px)}button{min-height:6.5vh;padding:1.2vh 1.6vw;font-size:clamp(16px,1.3vw,22px)}.stats{margin:1.5vh 0 .7vh}}
</style>
</head>
<body><main>
<header class="hero"><div><div>WILLKOMMEN · أهلاً بك</div><h1>Mein Mathetrainer</h1><p>مدرّب الرياضيات الذكي · Deutsch + عربي</p><div class="row"><span class="pill">🎯 حتى 100</span><span class="pill">⭐ مستويات متدرجة</span></div></div><div class="owl">🦉</div></header>
<div id="home">
<div class="stats"><b>تقدمك الإجمالي</b><b id="progressText">0 / 60 تمريناً</b></div><div class="bar"><span id="progressBar"></span></div>
<h2>رحلة المستويات</h2><p class="muted">لا يُفتح المستوى التالي إلا بعد إتقان السابق بنسبة 100%.</p>
<div class="levels" id="levels"></div>
<div class="row" style="margin-top:18px"><button id="sound">🔊 الصوت: يعمل</button><button id="showStats">📊 سجل الإنجاز</button><button id="reset">إعادة ضبط التقدم</button></div>
<div id="stats" class="card hidden" style="margin-top:15px"></div>
</div>
<section id="game" class="hidden">
<div class="row" style="justify-content:space-between"><button id="back">← القائمة</button><b id="levelName"></b><span class="pill" id="counter">1 / 10</span></div>
<div class="bar" style="margin:12px 0"><span id="roundBar"></span></div>
<div class="card question"><div class="muted" id="category"></div><h2 id="title"></h2><div class="muted" id="help"></div><div class="mainq" id="mainq"></div><div id="visual"></div></div>
<div class="answers" id="answers"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div>
<div class="row" style="justify-content:space-between"><button id="hint">💡 تلميح</button><button id="next" class="primary hidden">السؤال التالي ←</button></div>
</section>
<section id="finish" class="card center hidden" style="margin-top:20px"><div class="big">🏆</div><h1>أحسنت! رائع جداً!</h1><p>لقد أتقنت جميع تمارين هذا المستوى.</p><div class="big">⭐⭐⭐</div><p id="finishDetail"></p><button class="primary" id="finishBack">متابعة رحلة التعلم</button></section>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),key='mathetrainer_tv_v1';
const levels=[
['الأعداد حتى 20','Zahlen bis 20','🔢','التعرف على الأعداد والجمع والطرح البسيط'],
['الأعداد حتى 50','Zahlen bis 50','🌱','العشرات والآحاد وخط الأعداد'],
['الأعداد حتى 100','Zahlen bis 100','🚀','القيمة المكانية والجمع والطرح'],
['تجاوز العشرات','Zehnerübergang','🧠','الجمع والطرح مع تجاوز العشرات'],
['استراتيجيات الحساب','Rechenstrategien','🧩','الأنماط والأهرامات والمسائل المركبة'],
['تحدي الأبطال','Mathe-Champion','🏆','مراجعة شاملة وتحديات متنوعة']];
let data;try{data=JSON.parse(localStorage.getItem(key))||{completed:[],stars:0,wrong:0,sound:true}}catch(e){data={completed:[],stars:0,wrong:0,sound:true}}
let lvl=0,idx=0,qs=[],cur=null,selected=0,locked=false,wrongRound=0,ctx;
const save=()=>localStorage.setItem(key,JSON.stringify(data));
const show=id=>['home','game','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==id));
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>a.sort(()=>Math.random()-.5);
function question(){
 let a,b,ans,kind=rand(0,4),max=[20,50,100,100,100,100][lvl];
 if(lvl===0){a=rand(1,10);b=rand(1,10);if(kind===0){ans=a+b;return ['Rechne aus','احسب الناتج',`${a} + ${b} = ?`,ans,'ابدأ من العدد الأكبر وأضف العدد الآخر.','Addition']}if(kind===1){if(b>a)[a,b]=[b,a];ans=a-b;return ['Rechne aus','احسب الناتج',`${a} − ${b} = ?`,ans,'ارجع للخلف بعدد خطوات يساوي العدد الثاني.','Subtraktion']}a=rand(2,19);let next=rand(0,1);ans=a+(next?1:-1);return [next?'Welche Zahl kommt danach?':'Welche Zahl kommt davor?','ما العدد السابق أو اللاحق؟',next?`${a} → ?`:`? ← ${a}`,ans,'السابق أقل بواحد واللاحق أكبر بواحد.','Zahlenreihe']}
 if(kind===0){a=rand(10,max-10);let n=rand(0,1);ans=n?Math.ceil(a/10)*10:Math.floor(a/10)*10;return [n?'Ergänze zum nächsten Zehner':'Welcher Zehner liegt darunter?','أكمل إلى العشرة التالية أو السابقة',`${a} → ?`,ans,'انظر إلى خانة الآحاد.','Zehner']}
 if(kind===1){a=rand(10,max-2);let n=rand(0,1);ans=a+(n?1:-1);return [n?'Welche Zahl kommt danach?':'Welche Zahl kommt davor?','ما العدد السابق أو اللاحق؟',n?`${a} → ?`:`? ← ${a}`,ans,'أضف واحداً أو اطرح واحداً.','Zahlenreihe']}
 if(kind===2){let step=rand(2,8),start=rand(1,max-step*4);ans=start+step*3;return ['Ergänze die Zahlenreihe','أكمل المتتالية',`${start} , ${start+step} , ${start+2*step} , ?`,ans,'اكتشف مقدار الزيادة بين الأعداد.','Zahlenmuster']}
 if(kind===3){a=rand(12,max-20);b=rand(1,Math.min(20,max-a));ans=a+b;return ['Rechne aus','احسب الناتج',`${a} + ${b} = ?`,ans,'اجمع الآحاد أولاً ثم العشرات.','Addition']}
 a=rand(25,max);b=rand(1,Math.min(a-1,20));ans=a-b;return ['Rechne aus','احسب الناتج',`${a} − ${b} = ?`,ans,'اطرح الآحاد ثم العشرات.','Subtraktion'];
}
function options(ans){let s=new Set([ans]);while(s.size<4){let n=ans+rand(-12,12);if(n>=0&&n<=100)s.add(n)}return shuffle([...s])}
function renderHome(){
 let unlocked=0;while(unlocked<6&&data.completed.includes(unlocked))unlocked++;
 $('progressText').textContent=(data.completed.length*10)+' / 60 تمريناً';$('progressBar').style.width=(data.completed.length/6*100)+'%';
 $('levels').innerHTML=levels.map((x,i)=>{let done=data.completed.includes(i),open=i<=unlocked;return `<button class="card level ${open?'':'locked'}" data-l="${i}" ${open?'':'disabled'}><div class="top"><span>${x[2]}</span><span class="pill">${done?'✓ مكتمل':open?'متاح':'🔒 مقفل'}</span></div><b>${i+1}. ${x[0]}</b><div dir="ltr">${x[1]}</div><p class="muted">${x[3]}</p><small>${done?'10 / 10 – 100%':open?'10 تمارين لإتقان المستوى':'أكمل المستوى السابق أولاً'}</small></button>`}).join('');
 document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>start(+b.dataset.l));
 $('sound').textContent=data.sound?'🔊 الصوت: يعمل':'🔇 الصوت: متوقف';
}
function start(n){lvl=n;idx=0;wrongRound=0;qs=Array.from({length:10},question);show('game');renderQ()}
function renderQ(){locked=false;cur=qs[idx];selected=0;$('levelName').textContent=levels[lvl][0];$('counter').textContent=(idx+1)+' / 10';$('roundBar').style.width=(idx*10)+'%';$('category').textContent=cur[5];$('title').textContent=cur[0];$('help').textContent=cur[1];$('mainq').textContent=cur[2];$('visual').textContent='';$('feedback').className='feedback hidden';$('next').classList.add('hidden');cur.opts=options(cur[3]);$('answers').innerHTML=cur.opts.map((v,i)=>`<button class="answer" data-i="${i}">${v}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(+b.dataset.i));select();setTimeout(()=>{const first=document.querySelector('.answer');if(first)first.focus({preventScroll:true})},50)}
function select(){document.querySelectorAll('[data-i]').forEach((b,i)=>b.classList.toggle('selected',i===selected))}
function unlockAudio(){if(!data.sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}
function beep(ok){if(!data.sound)return;try{if(window.AndroidSound){if(ok)AndroidSound.playCorrect();else AndroidSound.playWrong();return}}catch(e){}try{unlockAudio();if(!ctx)return;const now=ctx.currentTime;const notes=ok?[660,880]:[260,170];notes.forEach((freq,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,now+i*.16);g.gain.setValueAtTime(.0001,now+i*.16);g.gain.exponentialRampToValueAtTime(.22,now+i*.16+.025);g.gain.exponentialRampToValueAtTime(.0001,now+i*.16+.14);o.connect(g);g.connect(ctx.destination);o.start(now+i*.16);o.stop(now+i*.16+.15)})}catch(e){}}
function answer(i){if(locked)return;let ok=cur.opts[i]===cur[3];$('feedback').classList.remove('hidden');if(ok){locked=true;data.stars++;save();beep(true);$('feedback').className='feedback good';$('feedback').innerHTML='<b>🎉 Richtig! إجابة صحيحة!</b><p>Sehr gut! ممتاز، استمر!</p>';document.querySelectorAll('[data-i]').forEach(b=>{b.disabled=true;if(+b.textContent===cur[3])b.style.border='3px solid #16834b'});$('next').classList.remove('hidden')}else{wrongRound++;data.wrong++;save();beep(false);$('feedback').className='feedback bad';$('feedback').innerHTML='<b>حاول مرة أخرى 💪</b><p>'+cur[4]+'</p>'}}
$('next').onclick=()=>{if(idx<9){idx++;renderQ()}else{data.completed.push(lvl);save();$('finishDetail').textContent='أكملت '+levels[lvl][0]+' بنجاح. عدد المحاولات الخاطئة: '+wrongRound;show('finish');renderHome()}};
$('hint').onclick=()=>{$('feedback').className='feedback';$('feedback').textContent='💡 '+cur[4]};
$('back').onclick=()=>{show('home');renderHome()};
$('finishBack').onclick=()=>{show('home');renderHome()};
$('sound').onclick=()=>{data.sound=!data.sound;save();renderHome()};
$('showStats').onclick=()=>{$('stats').classList.toggle('hidden');$('stats').innerHTML=`<b>📊 سجل الإنجاز</b><p>المستويات المكتملة: ${data.completed.length} / 6</p><p>النجوم: ⭐ ${data.stars}</p><p>المحاولات الخاطئة: ${data.wrong}</p>`};
$('reset').onclick=()=>{if(confirm('هل تريد حذف كل التقدم والنجوم؟')){data={completed:[],stars:0,wrong:0,sound:true};save();renderHome()}};
function visibleButtons(){return [...document.querySelectorAll('button')].filter(b=>!b.disabled&&!b.closest('.hidden')&&b.offsetParent!==null)}
function focusButton(btn){if(!btn)return;btn.focus({preventScroll:true});btn.scrollIntoView({block:'nearest',inline:'nearest'});}
window.handleRemoteKey=function(key){unlockAudio();const gameOn=!$('game').classList.contains('hidden');if(gameOn){const answerButtons=[...document.querySelectorAll('.answer')].filter(b=>!b.disabled);const active=document.activeElement;let pos=answerButtons.indexOf(active);if(pos<0)pos=selected;
 if(!locked&&answerButtons.length){let next=pos;if(key==='ArrowRight'||key==='ArrowDown')next=(pos+1)%answerButtons.length;else if(key==='ArrowLeft'||key==='ArrowUp')next=(pos+answerButtons.length-1)%answerButtons.length;else if(key==='Enter'||key===' ') {answer(pos);return true;}else return false;selected=next;select();focusButton(answerButtons[next]);return true;}
 if(locked&&(key==='Enter'||key===' ')){ $('next').click();return true;}
 if(key==='ArrowUp'||key==='ArrowDown'){focusButton(key==='ArrowUp'?$('back'):$('hint'));return true;}if(key==='Enter'||key===' '){if(document.activeElement&&document.activeElement.tagName==='BUTTON')document.activeElement.click();return true;}return false;
 }
 const btns=visibleButtons();let pos=btns.indexOf(document.activeElement);if(pos<0)pos=0;if(key==='ArrowRight'||key==='ArrowDown')pos=(pos+1)%btns.length;else if(key==='ArrowLeft'||key==='ArrowUp')pos=(pos+btns.length-1)%btns.length;else if(key==='Enter'||key===' '){if(btns[pos])btns[pos].click();return true;}else return false;focusButton(btns[pos]);return true;};
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','Enter',' '].includes(e.key)){if(window.handleRemoteKey(e.key)){e.preventDefault();e.stopPropagation();}}});
document.addEventListener('pointerdown',unlockAudio,{passive:true});document.addEventListener('touchstart',unlockAudio,{passive:true});
renderHome();setTimeout(()=>{const first=document.querySelector('.level:not([disabled])');if(first)first.focus({preventScroll:true})},100);
})();
</script></body></html>
